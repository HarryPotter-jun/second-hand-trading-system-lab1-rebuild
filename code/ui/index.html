<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>校园集市</title>
  <style>
    :root{--ink:#17233b;--muted:#75839c;--line:#e7ecf4;--paper:#f5f7fb;--card:#fff;--indigo:#252c5b;--violet:#5c63dc;--orange:#ff6947;--mint:#e7f8ee;--amber:#fff1d9;--blue:#eaf1ff}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px "Microsoft YaHei","Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{min-height:100vh;display:grid;grid-template-columns:256px 1fr}.side{background:linear-gradient(180deg,#222951,#1d2347);padding:30px 17px;color:#fff;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:4px 11px 33px;font-size:19px;font-weight:800}.brand-mark{background:linear-gradient(135deg,#ff916b,#ff5c3c);border-radius:13px;width:39px;height:39px;display:grid;place-items:center;box-shadow:0 10px 24px #ff76454c}.nav{display:grid;gap:7px}.nav button{padding:13px 15px;border-radius:12px;background:transparent;color:#bec8e5;text-align:left;font-weight:700;letter-spacing:.2px}.nav button:hover,.nav .active{color:#fff;background:#363f76}.side-note{margin-top:auto;color:#aab5d5;font-size:12px;line-height:1.9;padding:12px}.main{width:min(1120px,100%);margin:auto;padding:30px 42px 45px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.eyebrow{font-size:12px;color:#8591a8}.title{font-size:29px;letter-spacing:-.7px;margin:5px 0 0}.avatar{border-radius:15px;width:44px;height:44px;background:#ffe4d8;color:#e95335;display:grid;place-items:center;font-weight:900}.hero{padding:31px;border-radius:26px;min-height:182px;color:#fff;overflow:hidden;position:relative;background:linear-gradient(120deg,#252c5b,#6169df)}.hero:after{content:"";position:absolute;right:-80px;top:-135px;width:300px;height:300px;border:42px solid #fff1;border-radius:50%}.hero h2{margin:0 0 10px;font-size:25px}.hero p{margin:0 0 23px;color:#dce1ff}.search{display:flex;width:min(560px,100%);position:relative;z-index:1;background:#fff;border-radius:14px;padding:5px}.search input{padding:10px 13px;border:0;outline:0;flex:1;background:transparent;color:var(--ink)}.primary{color:#fff;background:linear-gradient(135deg,#ff916c,#ff5b3b);box-shadow:0 8px 18px #ff6b4740;border-radius:11px;padding:10px 17px;font-weight:800}.secondary{color:#ee5a3b;background:#fff0eb;border-radius:11px;padding:10px 17px;font-weight:800}.ghost{color:#53617a;background:#edf1f7;border-radius:11px;padding:10px 17px;font-weight:800}.section{display:flex;align-items:center;justify-content:space-between;margin:29px 0 14px}.section h3{margin:0;font-size:18px}.section span{font-size:12px;color:#8995ab}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.chip{padding:8px 13px;border-radius:99px;background:#edf1f7;color:#627088;font-size:12px;font-weight:800}.chip.on{background:#ffebe3;color:#f05c3d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.product{background:#fff;border-radius:20px;padding:11px;text-align:left;box-shadow:0 6px 21px #2435660b;transition:.18s}.product:hover{transform:translateY(-4px);box-shadow:0 16px 30px #24356618}.picture{height:121px;border-radius:14px;display:grid;place-items:center;font-size:48px}.product-title{font-size:14px;line-height:1.45;display:block;margin:10px 2px 6px;min-height:40px}.meta{font-size:11px;color:#8a96ad}.price{color:#f15738;font-size:19px;font-weight:900;margin-top:8px}.tag{display:inline-block;background:var(--mint);color:#26875b;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800;margin-left:4px}.tag.wait{background:var(--amber);color:#bd7919}.tag.pending{background:var(--blue);color:#4d6fd0}.panel{background:#fff;padding:25px;border-radius:22px;box-shadow:0 8px 22px #2435660a}.empty{padding:55px;text-align:center;color:#8a96ad}.wide{grid-column:span 4}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px;font-size:12px;font-weight:800;color:#526078}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{background:#f3f5fa;border:1px solid transparent;border-radius:11px;outline:0;padding:12px;color:var(--ink);resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#ff987e;background:#fff}.toolbar{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.detail{display:grid;grid-template-columns:1fr .95fr;gap:24px}.detail-picture{height:330px;border-radius:26px;background:#eaf1ff;display:grid;place-items:center;font-size:110px}.detail h2{font-size:25px;margin:11px 0}.detail .price{font-size:32px}.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid #edf0f5}.row span{color:#8996ac}.row:last-child{border:0}.order-actions{display:flex;gap:8px;align-items:center}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f0f3ff;border-radius:16px;padding:18px}.stat:nth-child(2){background:#e8f7ef}.stat:nth-child(3){background:#fff2dc}.stat b{font-size:25px}.stat span{display:block;color:#8390a7;font-size:12px;margin-top:5px}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% 15%,#ffded3,transparent 25%),radial-gradient(circle at 20% 85%,#dfe5ff,transparent 30%),#f7f8fc}.login-card{width:890px;min-height:515px;background:#fff;border-radius:30px;display:grid;grid-template-columns:1.08fr .92fr;overflow:hidden;box-shadow:0 30px 70px #28315b25}.login-copy{background:linear-gradient(145deg,#28315b,#5359c9);padding:62px;color:#fff;position:relative;overflow:hidden}.login-copy:after{content:"";border:45px solid #ffffff14;width:280px;height:280px;border-radius:50%;position:absolute;bottom:-170px;right:-110px}.login-logo{width:60px;height:60px;display:grid;place-items:center;background:#ff704b;border-radius:20px;font-size:28px}.login-copy h1{font-size:35px;margin:30px 0 12px}.login-copy p{color:#d9e0ff;line-height:1.9}.login-form{padding:62px 58px}.login-form h2{margin:0 0 8px}.login-form>p{color:#8a96ad;font-size:13px;margin:0 0 24px}.login-form .primary{width:100%;margin-top:12px}.auth-switch{background:transparent;color:#e85a3b;font-weight:800;margin-top:16px;padding:5px}.toast{position:fixed;right:28px;bottom:25px;background:#202649;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:0 14px 30px #17233b2c;display:none;z-index:10}.modal{position:fixed;inset:0;background:#17233b55;display:grid;place-items:center;z-index:20}.modal-box{background:#fff;border-radius:20px;padding:25px;width:min(460px,90vw);box-shadow:0 25px 55px #17233b44}.modal-box h3{margin:0 0 16px}.notice{padding:13px 15px;border-radius:12px;background:#edf3ff;color:#4d6fd0;font-size:12px;margin:12px 0}.profile-hero{background:linear-gradient(120deg,#252c5b,#525bc8);color:#fff;border-radius:24px;padding:28px}.profile-hero h2{margin:5px 0}.profile-hero p{color:#d8dfff;margin-bottom:0}.timeline{border-left:2px solid #e6ecf5;margin:12px 0 0 8px;padding-left:22px}.timeline div{position:relative;margin:16px 0}.timeline div:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#ff6b47;left:-28px;top:4px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}.login-card{width:92%;grid-template-columns:1fr}.login-copy{display:none}.login-form{padding:42px 32px}.detail{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}}
  </style>
</head>
<body>
  <div id="app"></div><div class="toast" id="toast"></div><div id="modal"></div>
  <script>
    const app=document.querySelector('#app'),modal=document.querySelector('#modal');
    let user=null,items=[],filters={keyword:'',category:'全部',status:'全部'};
    const api=()=>window.pywebview.api;
    const esc=value=>String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
    const toast=message=>{const el=document.querySelector('#toast');el.textContent=message;el.style.display='block';setTimeout(()=>el.style.display='none',2800)};
    async function call(method,...args){const result=await api()[method](...args);if(!result.ok){toast(result.message);return null}return result.data}
    const isBuyer=()=>user?.role==='买家',isSeller=()=>user?.role==='卖家',isAdmin=()=>user?.role==='管理员';
    const tag=status=>`<em class="tag ${status==='待审核'?'pending':status==='在售'?'':'wait'}">${esc(status)}</em>`;
    const header=(title,sub='')=>`<header class="top"><div><div class="eyebrow">${sub}</div><h1 class="title">${title}</h1></div><div class="avatar">${esc(user?.name?.slice(0,1)||'访')}</div></header>`;
    const nav=(active)=>`<aside class="side"><div class="brand"><div class="brand-mark">◎</div>校园集市</div><div class="nav">${[['首页','home'],['收藏','favorites'],['我的预约','orders'],['我的商品','sellerProducts'],['发布闲置','publish'],['个人中心','profile']].map(([label,page])=>`<button class="${active===page?'active':''}" onclick="go('${page}')">${label}</button>`).join('')}${isAdmin()?'<button onclick="go(\'admin\')">管理工作台</button>':''}</div><div class="side-note">线下交易 · 状态透明<br>预约唯一 · 交易可追溯</div></aside>`;
    const shell=(body,active)=>`<div class="shell">${nav(active)}<main class="main">${body}</main></div>`;
    const productCard=p=>`<button class="product" onclick="detail(${p.id})"><div class="picture" style="background:${['#e7efff','#fff0d9','#e4f8ed','#eee8ff'][p.id%4]}">${p.image_icon}</div><b class="product-title">${esc(p.title)}</b><div class="meta">${esc(p.seller_name)} · ${esc(p.condition_text)}</div><div class="price">¥ ${Number(p.price).toLocaleString()} ${tag(p.status)}</div></button>`;
    const field=(name,label,value='',type='text',full=false)=>`<label class="field ${full?'full':''}">${label}<input name="${name}" value="${esc(value)}" type="${type}"></label>`;
    const textarea=(name,label,value='')=>`<label class="field full">${label}<textarea name="${name}" rows="4">${esc(value)}</textarea></label>`;
    function showModal(title,content,onSubmit,label='确认'){modal.innerHTML=`<div class="modal"><form class="modal-box" id="modalForm"><h3>${title}</h3>${content}<div class="toolbar"><button type="button" class="ghost" onclick="closeModal()">取消</button><button class="primary">${label}</button></div></form></div>`;document.querySelector('#modalForm').onsubmit=event=>{event.preventDefault();onSubmit(new FormData(event.target))}}
    function closeModal(){modal.innerHTML=''}
    function loginView(register=false){app.innerHTML=`<div class="login"><div class="login-card"><section class="login-copy"><div class="login-logo">◎</div><h1>校园二手集市</h1><p>让每一件闲置，继续在校园里有用。<br>清晰状态、线下见面、安心交易。</p></section><form class="login-form" id="authForm"><h2>${register?'创建新账号':'欢迎回来'}</h2><p>${register?'选择买家或卖家身份，开始校园交易。':'登录后继续管理你的校园好物。'}</p>${register?`${field('phone','手机号')} ${field('name','公开昵称')} ${field('password','密码','','password')}<label class="field">角色<select name="role"><option>买家</option><option>卖家</option></select></label>`:`${field('phone','手机号','13800000001')} ${field('password','密码','buyer123','password')}`}<button class="primary">${register?'创建账号':'登录，开始逛逛'}</button><button class="auth-switch" type="button" onclick="loginView(${!register})">${register?'已有账号，返回登录':'没有账号？立即注册'}</button><p>演示：买家 13800000001 / buyer123<br>卖家 13800000002 / seller123 · 管理员 13800000003 / admin123</p></form></div></div>`;document.querySelector('#authForm').onsubmit=async event=>{event.preventDefault();let data=new FormData(event.target),result=register?await call('register',data.get('phone'),data.get('name'),data.get('password'),data.get('role')):await call('login',data.get('phone'),data.get('password'));if(result){user=result;go('home')}}}
    async function go(page){if(!user)return loginView();if(page==='home'){items=await call('products',filters.keyword,filters.category,filters.status)||[];app.innerHTML=shell(`${header('发现校园好物','Campus Marketplace')}<section class="hero"><h2>今天，带走一件喜欢的东西</h2><p>从校园同学手中，找到恰好适合你的好物。</p><div class="search"><input id="searchBox" value="${esc(filters.keyword)}" placeholder="搜索商品、分类或关键词"><button onclick="search()">搜索</button></div></section><div class="chips">${['全部','数码','图书','运动','生活','票券'].map(c=>`<button class="chip ${filters.category===c?'on':''}" onclick="setCategory('${c}')">${c}</button>`).join('')}</div><div class="section"><h3>为你推荐</h3><span>${items.length} 件正在流转</span></div><div class="grid">${items.length?items.map(productCard).join(''):'<div class="empty wide">没有符合条件的商品，试试更换筛选条件。</div>'}</div>`,'home');return}
      if(page==='favorites'){let list=await call('favorites')||[];app.innerHTML=shell(`${header('我的收藏','Favorites')}<div class="section"><h3>喜欢的好物</h3><span>状态实时同步</span></div><div class="grid">${list.length?list.map(productCard).join(''):'<div class="empty wide">还没有收藏，去首页发现好物吧。</div>'}</div>`,'favorites');return}
      if(page==='orders'){let list=await call('orders')||[];app.innerHTML=shell(`${header('我的预约','My Reservations')}<div class="chips">${['全部','待确认','已确认','已完成','已取消','已拒绝'].map(s=>`<button class="chip" onclick="orders('${s}')">${s}</button>`).join('')}</div><div class="panel">${list.length?list.map(orderRow).join(''):'<div class="empty">暂无预约记录</div>'}</div>`,'orders');return}
      if(page==='sellerProducts'){let list=await call('seller_products');if(list===null)return;app.innerHTML=shell(`${header('我发布的商品','Seller Center')}<div class="section"><h3>${list.length} 件商品</h3><div class="order-actions"><button class="ghost" onclick="sellerOrders()">收到的预约</button><button class="primary" onclick="go('publish')">+ 发布商品</button></div></div><div class="chips">${['全部','草稿','待审核','在售','已预约','已售出','已下架'].map(s=>`<button class="chip" onclick="sellerProductsFilter('${s}')">${s}</button>`).join('')}</div><div class="panel">${list.length?list.map(sellerRow).join(''):'<div class="empty">还没有发布商品</div>'}</div>`,'sellerProducts');return}
      if(page==='publish'){if(!isSeller()){toast('发布功能仅对卖家开放');return}renderPublish();return}
      if(page==='profile'){renderProfile();return}
      if(page==='admin'){renderAdmin();return}
    }
    function search(){filters.keyword=document.querySelector('#searchBox').value.trim();go('home')}
    function setCategory(category){filters.category=category;go('home')}
    async function detail(id){const p=await call('product',id);if(!p)return;app.innerHTML=shell(`${header('商品详情','Product Details')}<div class="detail"><div class="detail-picture">${p.image_icon}</div><section class="panel">${tag(p.status)}<h2>${esc(p.title)}</h2><div class="price">¥ ${Number(p.price).toLocaleString()}</div>${[['成色',p.condition_text],['分类',p.category],['交付方式',p.delivery_method],['卖家',p.seller_name],['发布时间',p.published_at]].map(([k,v])=>`<div class="row"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}<div class="actions">${isBuyer()?`<button class="secondary" onclick="favorite(${p.id})">收藏</button>${p.status==='在售'?`<button class="primary" onclick="reserve(${p.id},${p.version})">立即预约</button>`:''}<button class="ghost" onclick="reportProduct(${p.id})">举报</button>`:''}${isSeller()&&p.seller_id===user.id?`<button class="primary" onclick="editProduct(${p.id})">编辑商品</button>${p.status==='在售'?`<button class="secondary" onclick="offShelf(${p.id})">下架</button>`:''}`:''}</div></section></div>`,'home')}
    async function favorite(id){let result=await call('favorite',id);if(result!==null)toast(result?'已加入收藏':'已取消收藏')}
    async function reserve(id,version){if(await call('reserve',id,version)!==null){toast('预约成功，等待卖家确认');go('orders')}}
    async function reportProduct(id){showModal('举报商品',textarea('reason','举报原因（必填）'),async data=>{if(await call('report_product',id,data.get('reason'))!==null){closeModal();toast('举报已提交，等待管理员处理')}})}
    function orderRow(o){let action='';if(o.status==='待确认'||(o.status==='已确认'&&!o.seller_delivered_at))action=`<button class="secondary" onclick="cancelOrder(${o.id})">取消预约</button>`;if(o.status==='已确认'&&o.seller_delivered_at)action=`<button class="primary" onclick="receiveOrder(${o.id})">确认收货</button>`;return `<div class="row"><div><b>${esc(o.title)}</b><br><span>卖家 ${esc(o.seller_name)} · ¥${o.price}</span><br><small>${o.created_at}</small></div><div class="order-actions">${tag(o.status)}${action}</div></div>`}
    async function orders(status='全部'){let list=await call('orders')||[];if(status!=='全部')list=list.filter(x=>x.status===status);app.innerHTML=shell(`${header('我的预约','My Reservations')}<div class="chips">${['全部','待确认','已确认','已完成','已取消','已拒绝'].map(s=>`<button class="chip ${status===s?'on':''}" onclick="orders('${s}')">${s}</button>`).join('')}</div><div class="panel">${list.length?list.map(orderRow).join(''):'<div class="empty">没有该状态的预约。</div>'}</div>`,'orders')}
    async function cancelOrder(id){if(await call('cancel_reservation',id)!==null){toast('预约已取消，商品恢复在售');go('orders')}}
    async function receiveOrder(id){if(await call('confirm_receipt',id)!==null){toast('交易已完成');go('orders')}}
    async function sellerProductsFilter(status){let list=await call('seller_products');if(list===null)return;if(status!=='全部')list=list.filter(p=>p.status===status);app.innerHTML=shell(`${header('我发布的商品','Seller Center')}<div class="section"><h3>${status} · ${list.length} 件</h3><div class="order-actions"><button class="ghost" onclick="sellerOrders()">收到的预约</button><button class="primary" onclick="go('publish')">+ 发布商品</button></div></div><div class="chips">${['全部','草稿','待审核','在售','已预约','已售出','已下架'].map(s=>`<button class="chip ${s===status?'on':''}" onclick="sellerProductsFilter('${s}')">${s}</button>`).join('')}</div><div class="panel">${list.length?list.map(sellerRow).join(''):'<div class="empty">没有该状态的商品</div>'}</div>`,'sellerProducts')}
    function sellerRow(p){let canEdit=['草稿','待审核','在售'].includes(p.status);let buttons=`<button class="ghost" onclick="detail(${p.id})">查看</button>${canEdit?`<button class="secondary" onclick="editProduct(${p.id})">编辑</button>`:''}`;if(p.status==='在售')buttons+=`<button class="secondary" onclick="offShelf(${p.id})">下架</button>`;return `<div class="row"><div><b>${esc(p.title)}</b><br><span>¥${p.price} · ${p.category} · v${p.version}</span>${p.review_reason?`<br><small style="color:#e55336">驳回原因：${esc(p.review_reason)}</small>`:''}</div><div class="order-actions">${tag(p.status)}${buttons}</div></div>`}
    function renderPublish(product=null){const p=product||{title:'',description:'',category:'数码',condition_text:'9成新',price:'',image_icon:'📦',delivery_method:'校内自取'};app.innerHTML=shell(`${header(product?'编辑商品':'发布闲置','Seller Center')}<form class="panel" id="productForm"><div class="form-grid">${field('title','标题',p.title,true)}${textarea('description','描述',p.description)}${field('category','分类',p.category)}${field('condition','成色',p.condition_text)}${field('price','价格（元）',p.price,'number')}${field('delivery','交付方式',p.delivery_method)}${field('icon','商品图标',p.image_icon)}</div><div class="toolbar">${product?'':`<button type="button" class="secondary" onclick="saveProduct(false)">保存草稿</button>`}<button type="button" class="primary" onclick="saveProduct(true,${product?.id||0})">${product?'保存修改':'提交审核'}</button></div></form>`,'publish')}
    function fieldsFromForm(){let data=new FormData(document.querySelector('#productForm'));return Object.fromEntries(data.entries())}
    async function saveProduct(submit,id=0){let fields=fieldsFromForm(),result=id?await call('update_product',id,fields):await call('create_product',fields,submit);if(result!==null){toast(id?'商品已更新':submit?'商品已提交审核':'草稿已保存');go('sellerProducts')}}
    async function editProduct(id){let p=await call('product',id);if(p)renderPublish(p)}
    async function offShelf(id){if(await call('off_shelf',id)!==null){toast('商品已下架');go('sellerProducts')}}
    async function renderProfile(){let personal=user.role==='卖家'?await call('seller_products'):user.role==='买家'?await call('orders'):[];app.innerHTML=shell(`${header('我的账户','Account')}<section class="profile-hero"><div class="eyebrow" style="color:#d7deff">${esc(user.role)}</div><h2>${esc(user.name)}</h2><p>本地保存交易、收藏和操作记录。<button class="ghost" style="margin-left:10px" onclick="rename()">修改昵称</button></p></section><div class="section"><h3>我的业务</h3><span>${personal?.length||0} 条记录</span></div><div class="panel"><div class="row"><b>收藏商品</b><button class="ghost" onclick="go('favorites')">查看</button></div><div class="row"><b>我的预约</b><button class="ghost" onclick="go('orders')">查看</button></div>${isSeller()?`<div class="row"><b>我发布的商品</b><button class="ghost" onclick="go('sellerProducts')">查看</button></div>`:''}${isAdmin()?`<div class="row"><b>平台管理工作台</b><button class="ghost" onclick="go('admin')">进入</button></div>`:''}<div class="row"><b>退出登录</b><button class="secondary" onclick="logout()">退出</button></div></div>`,'profile')}
    function rename(){showModal('修改公开昵称',field('name','新昵称',user.name),async data=>{let result=await call('update_nickname',data.get('name'));if(result){user=result;closeModal();renderProfile()}})}
    async function logout(){await call('logout');user=null;loginView()}
    async function sellerOrders(){let list=await call('seller_orders');if(list===null)return;app.innerHTML=shell(`${header('收到的预约','Seller Reservations')}<div class="panel">${list.length?list.map(o=>`<div class="row"><div><b>${esc(o.title)}</b><br><span>买家 ${esc(o.buyer_name)} · ${o.created_at}</span></div><div class="order-actions">${tag(o.status)}${o.status==='待确认'?`<button class="secondary" onclick="sellerAction('reject_reservation',${o.id})">拒绝</button><button class="primary" onclick="sellerAction('confirm_reservation',${o.id})">确认</button>`:''}${o.status==='已确认'&&!o.seller_delivered_at?`<button class="primary" onclick="sellerAction('confirm_delivery',${o.id})">确认交付</button>`:''}</div></div>`).join(''):'<div class="empty">暂无收到的预约</div>'}</div>`,'sellerProducts')}
    async function sellerAction(method,id){if(await call(method,id)!==null){toast('操作已完成');sellerOrders()}}
    async function renderAdmin(){if(!isAdmin()){toast('管理员账号才可进入工作台');return}let data=await call('admin');if(!data)return;app.innerHTML=shell(`${header('管理工作台','Admin Console')}<div class="stat-grid">${[['全部商品',Object.values(data.stats).reduce((a,b)=>a+b,0)],['在售',data.stats['在售']||0],['已预约',data.stats['已预约']||0],['已售出',data.stats['已售出']||0]].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}</div><div class="section"><h3>待审核商品</h3><button class="ghost" onclick="reports()">待处理举报</button></div><div class="panel">${data.pending.length?data.pending.map(p=>`<div class="row"><div><b>${esc(p.title)}</b><br><span>${p.seller_name} · ¥${p.price}</span></div><div class="order-actions"><button class="secondary" onclick="review(${p.id},false)">驳回</button><button class="primary" onclick="review(${p.id},true)">通过上架</button></div></div>`).join(''):'<div class="empty">暂无待审核商品</div>'}</div><div class="section"><h3>最近日志</h3></div><div class="panel">${data.logs.map(l=>`<div class="row"><span>${l.created_at}</span><b>${l.operator_name} · ${l.action} · ${l.result}</b></div>`).join('')}</div>`,'admin')}
    async function review(id,approved){let reason=approved?'审核通过':prompt('请填写驳回原因：','信息不完整，请补充后重新提交。');if(reason===null)return;if(await call('review_product',id,approved,reason)!==null){toast('审核结果已保存');renderAdmin()}}
    async function reports(){let list=await call('reports');if(list===null)return;app.innerHTML=shell(`${header('举报处理','Report Management')}<div class="panel">${list.length?list.map(r=>`<div class="row"><div><b>${esc(r.title)}</b><br><span>举报人 ${esc(r.reporter_name)} · ${esc(r.reason)}</span><br><small>${r.created_at}</small></div><div class="order-actions">${tag(r.status)}${r.status==='待处理'?`<button class="ghost" onclick="processReport(${r.id},false)">驳回</button><button class="secondary" onclick="processReport(${r.id},true)">确认违规</button>`:''}</div></div>`).join(''):'<div class="empty">暂无举报</div>'}</div>`,'admin')}
    async function processReport(id,violation){let reason=prompt('填写处理说明：',violation?'经审核确认违反平台规则。':'经审核未发现违规情况。');if(reason===null)return;if(await call('handle_report',id,violation,reason)!==null){toast('举报已处理');reports()}}
    loginView();
  </script>
</body>
</html>
